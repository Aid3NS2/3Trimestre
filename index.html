<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>

    <form>

        <input type="text" name="login" placeholder="email">
        <input type="text" name="password" placeholder="senha">
        <button>entrar</button>

    </form>

    <script>

        const frmLogin = document.querySelector('form')

        frmLogin.addEventListener("submit", async (ev) => {
            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "passwprd": frmLogin.password.value
                })
            })
            if (response.status == 404) {
                alert("Usuário não existente")
                return
            }
            if (response.status == 401) {
                alert("Senha Incorreta")
                return
            }

            if (response.ok) {
            alert("Usuário logged in :D")
            return
            }

            alert("You shouldn't have done that.")

        })

    </script>

</body>

</html>
