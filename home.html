<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    
    <h1>HOME</h1>
    <div class="profile">
        <img scr="" alt="" class="thumb">
        <p>Bem vindo, </p>
        <div class="username">...</div>
        <img src="https://media.tenor.com/QWGkhdBDu7EAAAAi/sebastian-solace-pressure.gif">
        <img src="https://media1.tenor.com/m/5b4pzLLa_iUAAAAd/sebastian-solace-dumb.gif">

    </div>

    <script>

        async function init() {
            const response = await fetch("/login/user")
            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }
            const data = await response.json()
            document.querySelector(".profile .username").textContent = data.username
        }
        init()

    </script>

</body>
</html>
